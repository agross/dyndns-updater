name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build pull request executables
        id: build
        if: github.event_name == 'pull_request'
        run: |
          short_sha=$(git rev-parse --short HEAD)
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="dyndns-updater_${short_sha}_${os}_${arch}"
            dir="dist/${os}_${arch}"
            mkdir -p "$dir/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$dir/$name/dyndns-updater" .
            tar -C "$dir/$name" -czf "$dir/$name.tar.gz" dyndns-updater
            rm -r "$dir/$name"
            (cd "$dir" && sha256sum ./*.tar.gz > checksums.txt)
          done
      - name: Upload Linux amd64 executable
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dyndns-updater-pr-${{ github.event.pull_request.number }}-linux-amd64-${{ steps.build.outputs.short_sha }}
          path: dist/linux_amd64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux arm64 executable
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dyndns-updater-pr-${{ github.event.pull_request.number }}-linux-arm64-${{ steps.build.outputs.short_sha }}
          path: dist/linux_arm64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS amd64 executable
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dyndns-updater-pr-${{ github.event.pull_request.number }}-macos-amd64-${{ steps.build.outputs.short_sha }}
          path: dist/darwin_amd64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS arm64 executable
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dyndns-updater-pr-${{ github.event.pull_request.number }}-macos-arm64-${{ steps.build.outputs.short_sha }}
          path: dist/darwin_arm64/
          if-no-files-found: error
          retention-days: 14
