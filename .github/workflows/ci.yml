name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build pull request executables
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="dyndns-updater_${GITHUB_SHA}_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/$name/dyndns-updater" .
            tar -C "dist/$name" -czf "dist/$name.tar.gz" dyndns-updater
            rm -r "dist/$name"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: Upload pull request executables
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dyndns-updater-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
