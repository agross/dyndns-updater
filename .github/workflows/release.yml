name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      commit:
        description: Commit reachable from the default branch (HEAD means its tip)
        required: false
        default: HEAD
        type: string
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must have the form v1.2.3' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Resolve commit
        id: resolve
        env:
          RELEASE_COMMIT: ${{ inputs.commit || 'HEAD' }}
        run: |
          commit=$(git rev-parse --verify --end-of-options "$RELEASE_COMMIT^{commit}")
          if ! git merge-base --is-ancestor "$commit" HEAD; then
            echo 'Release commit must be reachable from the default branch' >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  test:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
  release:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="dyndns-updater_${RELEASE_TAG}_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/$name/dyndns-updater" .
            tar -C "dist/$name" -czf "dist/$name.tar.gz" dyndns-updater
            rm -r "dist/$name"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [ -n "$existing" ]; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            if [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo 'Release tag does not point to the tested commit' >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --target "$(git rev-parse HEAD)" --generate-notes
