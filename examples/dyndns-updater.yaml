# Install as /etc/dyndns-updater.yaml, owned by root with mode 0600.
state: /var/lib/dyndns-updater/state.json
refresh: 600h # 25 days; Go duration syntax (h, m, s), not "25d"
timeout: 30s # per provider request and sendmail invocation
sendmail: /usr/sbin/sendmail
recipient: root
# Optional literal display name; requires sendmail -F full-name support.
# The MTA still chooses sender address/envelope sender. No app-side templates.
# sender_name: 'dyndns-updater on gateway-home'
# System DNS is always tried first. Omitted fallback_dns defaults to
# 1.1.1.1, 8.8.8.8, then 9.9.9.9 (all port 53).
# One request timeout covers DNS, all fallbacks, TLS and response together.
# Set fallback_dns: [] to disable; a nonempty list replaces the defaults.
# Defaults send provider hostname queries to Cloudflare, Google and Quad9 as needed.
# fallback_dns: []
# Custom examples below are documentation-only IPs.
# fallback_dns:
#   - "192.0.2.10"           # port 53 by default
#   - "2001:db8::10"        # bare IPv6, port 53
#   - "192.0.2.20:5353"     # optional explicit port
#   - "[2001:db8::20]:5353" # brackets required for IPv6 with port
profiles:
  gateway-dns:
    provider: desec
    interface: telekom
    target: gateway.example.invalid
    token: REPLACE_WITH_DESEC_TOKEN
  "Gateway tunnel":
    provider: tunnelbroker
    interface: telekom
    target: "123456" # Tunnel ID
    username: REPLACE_WITH_TUNNELBROKER_USERNAME
    password: REPLACE_WITH_TUNNEL_UPDATE_KEY
